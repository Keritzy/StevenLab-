<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StevenLab · Forensic Cabinet</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* --- Reset & Base --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1e26;
            font-family: 'Segoe UI', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            color: #d4d9e6;
        }

        .cabinet {
            max-width: 1300px;
            width: 100%;
        }

        /* --- Header / Lab Badge --- */
        .lab-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #4a7a9c;
            padding-bottom: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .lab-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #b0d4f0;
            text-shadow: 0 0 8px rgba(74, 122, 156, 0.4);
        }

        .lab-title i {
            color: #7aa9c9;
            font-size: 2rem;
        }

        .lab-title span {
            background: #2a3340;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 400;
            color: #a0b8cc;
            border: 1px solid #3a4a5a;
        }

        .live-badge {
            background: #2a3a2e;
            color: #8bc34a;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #4c7a4a;
            box-shadow: 0 0 12px #4c7a4a33;
        }

        .live-badge i {
            margin-right: 6px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* --- Cabinet Grid (drawers) --- */
        .drawer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        /* Each drawer = folder or file */
        .drawer {
            background: #232a33;
            border-radius: 12px 12px 8px 8px;
            border-left: 3px solid #3a5f7a;
            box-shadow: 0 8px 0 #0f1217, 0 6px 12px rgba(0,0,0,0.5);
            transition: all 0.15s ease;
            cursor: default;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .drawer:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #0f1217, 0 12px 20px rgba(0,0,0,0.7);
            background: #2a3440;
            border-left-color: #6a9fc9;
        }

        /* Drawer handle (icon + name) */
        .drawer-handle {
            padding: 1rem 0.8rem 0.6rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.1rem;
            font-weight: 500;
            border-bottom: 1px solid #2f3a47;
            min-height: 70px;
            word-break: break-word;
        }

        .drawer-handle i {
            font-size: 1.8rem;
            width: 2rem;
            text-align: center;
            color: #7aa9c9;
        }

        .drawer-handle .file-icon {
            color: #b0c7d9;
        }

        .drawer-handle .folder-icon {
            color: #e6b85e;
        }

        .drawer-handle .name {
            line-height: 1.3;
        }

        /* Drawer meta (size, date, etc) */
        .drawer-footer {
            margin-top: auto;
            padding: 0.5rem 0.8rem 0.7rem 0.8rem;
            background: #1e2630;
            font-size: 0.7rem;
            color: #8899aa;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #2a3340;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.3px;
        }

        .drawer-footer .size {
            background: #141a22;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
        }

        .drawer-footer .date {
            opacity: 0.7;
        }

        /* --- Special file/folder types (forensic vibe) --- */
        .drawer[data-type="folder"] .drawer-handle i {
            color: #e6b85e;
        }

        .drawer[data-type="file"] .drawer-handle i {
            color: #7aa9c9;
        }

        .drawer[data-type="script"] {
            border-left-color: #6a9f6a;
        }
        .drawer[data-type="script"] .drawer-handle i {
            color: #8bc34a;
        }

        .drawer[data-type="image"] {
            border-left-color: #b87a9c;
        }
        .drawer[data-type="image"] .drawer-handle i {
            color: #d48ab0;
        }

        .drawer[data-type="archive"] {
            border-left-color: #b09a6a;
        }
        .drawer[data-type="archive"] .drawer-handle i {
            color: #d4b87a;
        }

        /* --- Empty state / custom message --- */
        .empty-cabinet {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: #1e2630;
            border-radius: 20px;
            border: 2px dashed #3a4a5a;
            color: #7a8a9a;
        }
        .empty-cabinet i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .lab-title {
                font-size: 1.6rem;
                flex-wrap: wrap;
            }
            .drawer-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1.2rem;
            }
            .drawer-handle {
                font-size: 0.95rem;
                padding: 0.8rem 0.6rem 0.4rem 0.6rem;
                min-height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="cabinet">
        <!-- Header -->
        <header class="lab-header">
            <div class="lab-title">
                <i class="fas fa-flask"></i>
                StevenLab
                <span>forensic · cabinet</span>
            </div>
            <div class="live-badge">
                <i class="fas fa-circle"></i> LIVE · MOUNT
            </div>
        </header>

        <!-- Drawer Grid - populated by JavaScript from your repo structure -->
        <div id="drawerContainer" class="drawer-grid">
            <!-- JavaScript will inject items here -->
        </div>
    </div>

    <script>
        (function() {
            // ------------------------------------------------------------
            // 1. CONFIG: point to your GitHub repo raw contents
            //    (this uses the GitHub API to list the root of your repo)
            // ------------------------------------------------------------
            const REPO_OWNER = 'keritzy';
            const REPO_NAME = 'StevenLab-';
            const BRANCH = 'main'; // or 'master' — adjust if needed
            const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;

            // ------------------------------------------------------------
            // 2. Helper: get icon & type class based on file/folder name
            // ------------------------------------------------------------
            function getFileType(name, isFolder) {
                if (isFolder) return { icon: 'fa-folder', type: 'folder', iconClass: 'folder-icon' };

                const ext = name.split('.').pop().toLowerCase();
                const lower = name.toLowerCase();

                // Forensic / script extensions
                if (['py', 'js', 'sh', 'bash', 'ps1', 'pl', 'rb', 'go', 'rs', 'lua'].includes(ext)) {
                    return { icon: 'fa-code', type: 'script', iconClass: '' };
                }
                if (['txt', 'log', 'md', 'json', 'xml', 'csv', 'yaml', 'yml'].includes(ext)) {
                    return { icon: 'fa-file-alt', type: 'file', iconClass: '' };
                }
                if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'ico', 'webp'].includes(ext)) {
                    return { icon: 'fa-image', type: 'image', iconClass: '' };
                }
                if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2', 'xz', 'iso', 'img', 'dd', 'e01'].includes(ext)) {
                    return { icon: 'fa-archive', type: 'archive', iconClass: '' };
                }
                if (['exe', 'msi', 'dmg', 'pkg', 'deb', 'rpm'].includes(ext)) {
                    return { icon: 'fa-cog', type: 'file', iconClass: '' };
                }
                if (['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'].includes(ext)) {
                    return { icon: 'fa-file-pdf', type: 'file', iconClass: '' };
                }
                // fallback
                return { icon: 'fa-file', type: 'file', iconClass: '' };
            }

            // ------------------------------------------------------------
            // 3. Format file size (human readable)
            // ------------------------------------------------------------
            function formatSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }

            // ------------------------------------------------------------
            // 4. Render drawer items from GitHub API data
            // ------------------------------------------------------------
            function renderDrawers(items) {
                const container = document.getElementById('drawerContainer');
                if (!container) return;

                // If no items, show empty state
                if (!items || items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-cabinet">
                            <i class="fas fa-draw-polygon"></i>
                            <p>🔍 No files or folders found in this cabinet.</p>
                            <p style="font-size:0.85rem; margin-top:0.5rem;">Check repo: ${REPO_OWNER}/${REPO_NAME}</p>
                        </div>
                    `;
                    return;
                }

                // Sort: folders first, then files (alphabetical)
                const sorted = [...items].sort((a, b) => {
                    if (a.type === 'dir' && b.type !== 'dir') return -1;
                    if (a.type !== 'dir' && b.type === 'dir') return 1;
                    return a.name.localeCompare(b.name);
                });

                let html = '';
                for (const item of sorted) {
                    const isFolder = (item.type === 'dir');
                    const name = item.name;
                    const size = item.size || 0;
                    const date = item.html_url ? new Date(item.html_url).toLocaleDateString() : '—';

                    // Determine icon & type
                    const typeInfo = getFileType(name, isFolder);
                    const icon = typeInfo.icon;
                    const dataType = typeInfo.type;
                    const iconClass = typeInfo.iconClass || '';

                    // Build drawer HTML
                    html += `
                        <div class="drawer" data-type="${dataType}">
                            <div class="drawer-handle">
                                <i class="fas ${icon} ${iconClass}"></i>
                                <span class="name">${name}</span>
                            </div>
                            <div class="drawer-footer">
                                <span class="size">${isFolder ? '📁' : formatSize(size)}</span>
                                <span class="date">${date}</span>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            }

            // ------------------------------------------------------------
            // 5. Fetch from GitHub API and render
            // ------------------------------------------------------------
            async function fetchRepoContents() {
                const container = document.getElementById('drawerContainer');
                container.innerHTML = `
                    <div class="empty-cabinet" style="border-color: #3a5f7a;">
                        <i class="fas fa-spinner fa-pulse"></i>
                        <p>🔬 Mounting forensic cabinet...</p>
                        <p style="font-size:0.8rem; opacity:0.6;">fetching from ${REPO_OWNER}/${REPO_NAME}</p>
                    </div>
                `;

                try {
                    const response = await fetch(API_URL, {
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    });

                    if (!response.ok) {
                        throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    renderDrawers(data);
                } catch (error) {
                    console.error('Fetch error:', error);
                    container.innerHTML = `
                        <div class="empty-cabinet" style="border-color: #8a4a4a;">
                            <i class="fas fa-triangle-exclamation"></i>
                            <p>⚠️ UNABLE · TO · FETCH</p>
                            <p style="font-size:0.8rem; opacity:0.7;">${error.message}</p>
                            <p style="font-size:0.75rem; margin-top:0.8rem; opacity:0.5;">
                                <i class="fas fa-rotate-right"></i> 
                                <a href="#" onclick="location.reload();" style="color:#8ab4d8;">retry</a>
                            </p>
                        </div>
                    `;
                }
            }

            // ------------------------------------------------------------
            // 6. Start
            // ------------------------------------------------------------
            fetchRepoContents();
        })();
    </script>
</body>
</html>
